# Long Range Mission Scenario
# Extended range mission with higher altitude

name: "Long Range Mission"
description: "Long-range mission with optimized ILS parameters"

flight:
  altitude: 20.0
  airspeed: 5.0
  waypoint_radius: 3.0
  waypoint_pause: 1.0

map:
  default_map: "grid_maps/example_map.png"
  meters_per_cell: 2.0
  north_is_row_neg: true

mission:
  start: [5, 5]
  goal: [90, 90]

ils:
  enabled: true
  base_width: 0.03
  width_step: 0.02
  max_width: 0.25
  max_expansions: 10

safety:
  max_distance_from_home: 500
  rtl_on_complete: true
